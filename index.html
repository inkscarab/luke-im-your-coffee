const room=document.querySelector('#room'),desk=document.querySelector('#deskbook'),detail=document.querySelector('#detail'),scene=document.querySelector('#scene'),cover=document.querySelector('#cover'),toggleBtn=document.querySelector('#toggle'),back=document.querySelector('#back');let opened=false,busy=false;function focusBook(){if(busy)return;busy=true;room.classList.add('depart');setTimeout(()=>{detail.classList.add('visible');room.classList.add('hidden');busy=false;},760)}function flip(){opened=!opened;scene.classList.toggle('open',opened);toggleBtn.textContent=opened?'Закрыть книгу':'Открыть книгу';cover.setAttribute('aria-label',toggleBtn.textContent)}function returnDesk(){if(busy)return;opened=false;scene.classList.remove('open');toggleBtn.textContent='Открыть книгу';detail.classList.remove('visible');room.classList.remove('hidden');setTimeout(()=>room.classList.remove('depart'),80)}desk.addEventListener('click',focusBook);desk.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();focusBook()}});toggleBtn.addEventListener('click',flip);cover.addEventListener('click',flip);cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});back.addEventListener('click',returnDesk);function resize(){let vw=innerWidth,vh=document.querySelector('.bookview').clientHeight;scene.style.setProperty('--scale',Math.max(.15,Math.min((vw-32)/1420,(vh-36)/940,1)))}addEventListener('resize',resize);resize();

const viewer=document.getElementById('memoryViewer'),viewerImage=document.getElementById('viewerImage'),viewerClose=document.getElementById('viewerClose');const viewerMemoryLink=document.getElementById('viewerMemoryLink');let lastMemory=null;
document.querySelectorAll('.memory').forEach(item=>item.addEventListener('click',()=>{if(!opened)return;lastMemory=item;viewerImage.src=item.dataset.image;viewerImage.alt=item.dataset.name;if(item.dataset.memoryUrl){viewerMemoryLink.href=item.dataset.memoryUrl;viewerMemoryLink.textContent="заглянуть в Омут памяти";viewerMemoryLink.hidden=false}else if(item.dataset.externalUrl){viewerMemoryLink.href=item.dataset.externalUrl;viewerMemoryLink.textContent=item.dataset.externalLabel||"Открыть подарок";viewerMemoryLink.hidden=false}else{viewerMemoryLink.hidden=true;viewerMemoryLink.removeAttribute('href')}viewer.classList.add('active');viewerClose.focus()}));
function closeMemory(){viewer.classList.remove('active');viewerImage.removeAttribute('src');if(lastMemory)lastMemory.focus()}
viewerClose.addEventListener('click',closeMemory);viewer.addEventListener('click',e=>{if(e.target===viewer)closeMemory()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('active'))closeMemory()});
</script><script>
// Прозрачные поля PNG/WebP не должны перехватывать нажатия
// на лежащие под ними памятные вещи.
const alphaMasks = new WeakMap();
function isTransparentAt(button, x, y) {
  const img = button.querySelector('img');
  if (!img || !img.complete || !img.naturalWidth) return false;
  let mask = alphaMasks.get(img);
  if (!mask) {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d', {willReadFrequently:true});
      ctx.drawImage(img, 0, 0);
      mask = {width:canvas.width, height:canvas.height,
              data:ctx.getImageData(0,0,canvas.width,canvas.height).data};
      alphaMasks.set(img, mask);
    } catch (_) { return false; }
  }
  const r = img.getBoundingClientRect();
  const ix = Math.floor((x-r.left)/r.width*mask.width);
  const iy = Math.floor((y-r.top)/r.height*mask.height);
  if (ix<0 || iy<0 || ix>=mask.width || iy>=mask.height) return true;
  return mask.data[(iy*mask.width+ix)*4+3] < 24;
}
document.querySelector('.keepsakes').addEventListener('click', (event) => {
  let current = event.target.closest('.memory');
  if (!current) return;
  const skipped = [];
  while (current && isTransparentAt(current,event.clientX,event.clientY)) {
    current.style.pointerEvents='none';
    skipped.push(current);
    current = document.elementFromPoint(event.clientX,event.clientY)?.closest('.memory');
  }
  for (const item of skipped) item.style.pointerEvents='';
  if (skipped.length && current) {
    event.preventDefault();
    event.stopImmediatePropagation();
    current.click();
  }
}, true);
</script></body></html>
